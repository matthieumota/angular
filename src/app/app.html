<h1>{{ title }}</h1>

<app-pizza-selected [selectedPizza]="selectedPizza()" />

<ul class="pizzas">
  @for (pizza of pizzas; track pizza.id) {
    <li
      [class.selected]="pizza.id === selectedPizza()?.id"
      [ngClass]="{ 'a b c': true, d: true }"
      (click)="onSelect(pizza)"
    >
      <span>{{ pizza.id }}: {{ pizza.name }}</span>
      <img [src]="pizza.image" [alt]="pizza.name" />
    </li>
  }
</ul>
